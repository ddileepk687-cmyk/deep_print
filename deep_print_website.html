<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deep_print – 3D printed products and business services</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#0E0E0E;--line:#232323;--tx:#fff;--mut:#9A9A9A;
--home:#3DD6F5;--cat:#FFB020;--cart:#3DDC84;--svc:#B28CFF;--red:#FF5C5C;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Arial,sans-serif;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--home);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(12px + env(safe-area-inset-top,0px)) 20px 12px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap;max-width:1200px;margin:0 auto}.brand{order:1}.wallet{order:4}
.brand{font:800 24px "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
.brand i{color:var(--home);font-style:normal}
.wallet{border:1.5px solid var(--cart);background:transparent;border-radius:999px;padding:6px 14px;color:var(--cart);font-weight:500}
.search{order:3;flex:1;min-width:220px}
.search input{width:100%;background:#111;border:1.5px solid var(--line);border-radius:12px;color:var(--tx);padding:11px 14px;font:inherit}
.search input::placeholder{color:var(--mut)}
main{max-width:1200px;margin:0 auto;padding:20px 20px 48px;min-height:70vh}
h2.t{font-size:22px;margin:22px 0 12px;display:flex;align-items:center;gap:8px}
.live{width:9px;height:9px;border-radius:50%;background:var(--cart);animation:p 1.6s infinite}
@keyframes p{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.live{animation:none}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;border-top:3px solid var(--c)}
.st b{display:block;font:800 26px "Bricolage Grotesque",sans-serif;color:var(--c)}
.st span{color:var(--mut);font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chips button{flex:none;background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--mut)}
.chips button.on{border-color:var(--cat);color:var(--cat)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(4,1fr)}}@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:760px){.brand{margin-right:auto}.search{order:3;flex-basis:100%}nav.tabs{order:4;flex-basis:100%;overflow-x:auto}}
.hero{padding:28px 0 4px}.hero h1{font-size:clamp(34px,6vw,60px);font-weight:800;max-width:18ch}.hero p{color:var(--mut);max-width:54ch;margin:14px 0 20px;font-size:17px}.hb{display:flex;gap:10px;flex-wrap:wrap}.hb button{padding:12px 22px;border-radius:10px;font-weight:500;border:0}
footer{border-top:1px solid var(--line);padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));color:var(--mut);font-size:14px}footer div{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.th{position:relative;display:flex;justify-content:center;padding:14px;background:#080808}
.th svg{width:84px;height:84px}.th img{width:100%;height:150px;object-fit:cover;border-radius:8px}.row img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex:none}
.tag{position:absolute;left:8px;top:8px;background:var(--cat);color:#000;font-size:11px;font-weight:500;border-radius:6px;padding:2px 7px}
.pb{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.pb h3{font-size:15px}
.mut{color:var(--mut);font-size:12.5px}
.pr b{font-size:18px;font-family:"Bricolage Grotesque",sans-serif}
.pr s{color:var(--mut);font-size:12.5px;margin:0 6px}
.pr em{color:var(--cart);font-style:normal;font-size:12.5px}
.rate{color:var(--cat);font-size:13px}
.hist{display:flex;align-items:flex-end;gap:3px;height:26px;margin:2px 0}
.hist i{flex:1;background:var(--home);border-radius:2px 2px 0 0;min-height:3px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto;padding-top:6px}
.b{border:0;border-radius:8px;padding:8px 4px;font-weight:500;font-size:13px}
.b.buy{background:var(--cat);color:#000}
.b.add{background:transparent;border:1.5px solid var(--cart);color:var(--cart)}
.more{display:block;margin:16px auto;background:transparent;border:1.5px solid var(--cat);color:var(--cat);border-radius:10px;padding:10px 22px}
.row{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;align-items:center}
.row svg{width:56px;height:56px;flex:none}
.row div.i{flex:1}
.q{display:flex;align-items:center;gap:8px;margin-top:4px}
.q button{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);background:transparent}
.rm{background:none;border:0;color:var(--red);font-size:13px;text-decoration:underline}
.sum{background:var(--card);border:1px solid var(--cart);border-radius:14px;padding:14px;margin-top:14px}
.sum div{display:flex;justify-content:space-between;margin:4px 0}
.sum .tot{font:800 22px "Bricolage Grotesque",sans-serif;color:var(--cart)}
.big{width:100%;margin-top:10px;padding:14px;font-size:16px;border-radius:12px;border:0;background:var(--cart);color:#000;font-weight:500}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
.aud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.aud div{border:1.5px solid var(--svc);border-radius:12px;padding:10px;text-align:center;font-size:13px;color:var(--svc)}
.sv{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--svc);border-radius:14px;padding:14px;margin-bottom:10px}
.sv h3{font-size:18px;margin-bottom:4px}
.sv p{margin:0 0 10px;color:var(--mut)}
.sv button{background:var(--svc);color:#000;border:0;border-radius:8px;padding:8px 16px;font-weight:500}
nav.tabs{order:2;display:flex;gap:4px}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;color:var(--mut);display:flex;align-items:center;gap:6px;font-size:15px;position:relative}
nav.tabs button.on{color:var(--c);border-bottom-color:var(--c)}
nav.tabs svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#cb{position:static;background:var(--cart);color:#000;border-radius:999px;font-size:11px;font-weight:500;padding:0 6px;display:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:10px;z-index:40;display:none;max-width:90%;text-align:center}
#sheet{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:flex-end}
#sheet.o{display:flex}
#sheet div{background:#111;border-top:2px solid var(--cart);border-radius:18px 18px 0 0;width:100%;max-width:900px;margin:0 auto;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px))}
#sheet b{font:800 34px "Bricolage Grotesque",sans-serif;color:var(--cart);display:block;margin:6px 0 14px}
</style>
</head>
<body>
<header class="top">
  <div class="bar"><div class="brand">Deep<i>_</i>print</div><nav class="tabs" aria-label="Main tabs">
  <button data-t="home" style="--c:var(--home)"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg>Home</button>
  <button data-t="cat" style="--c:var(--cat)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Category</button>
  <button data-t="cart" style="--c:var(--cart)"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10.2l2-8H6"/><circle cx="9" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg>Cart<span id="cb">0</span></button>
  <button data-t="svc" style="--c:var(--svc)"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3"/></svg>Services</button>
</nav><div class="search"><input id="q" type="search" placeholder="Search 1000 models, e.g. vase, lamp, stand" aria-label="Search products"></div><button class="wallet" id="wb" aria-label="Open wallet">Wallet ₹5,000</button></div>
</header>
<main id="m"></main>
<footer><div><span>© 2026 Deep_print</span><span>3D printed products · Websites · Presentations · Data analytics</span></div></footer>
<div id="toast" role="status"></div>
<div id="sheet"><div><h3>Your wallet</h3><b id="wv"></b>
  <button class="big" data-a="topup" style="margin:0 0 8px">Add ₹500</button>
  <button class="big" data-a="closew" style="background:transparent;border:1.5px solid #444;color:#fff;margin:0">Close</button></div></div>

<script>
var $=function(s){return document.querySelector(s)};
var SH={
 vase:function(t){return .38+.42*Math.sin(Math.PI*Math.pow(t,.75))*(1-.2*t)+.1*t},
 planter:function(t){return .85-.25*(1-t)},
 shade:function(t){return .3+.65*t},
 cup:function(t){return .62+.03*Math.sin(t*40)},
 bowl:function(t){return .25+.7*Math.sqrt(1-Math.pow(1-t,2))*.95},
 step:function(t){return t<.5?.45+.1*Math.floor(t*10):.95-.1*Math.floor((t-.5)*10)}
};
function art(s,hue,n){var o='',lh=100/n;for(var i=0;i<n;i++){var w=Math.max(.15,Math.min(1,SH[s](i/(n-1))))*100;o+='<rect x="'+((100-w)/2).toFixed(1)+'" y="'+(i*lh).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+(lh*.8).toFixed(1)+'" rx="1" fill="hsl('+hue+',75%,62%)"/>'}return '<svg viewBox="0 0 100 100" aria-hidden="true">'+o+'</svg>'}
function r(i,k){var x=Math.sin(i*127.1+k*311.7)*43758.5453;return x-Math.floor(x)}
var AD=["Strata","Helix","Nova","Orbit","Terra","Lumen","Aero","Pixel","Zen","Atlas","Ripple","Vortex"];
var NO=[["Vase","Home Decor","vase"],["Planter","Home Decor","planter"],["Lamp Shade","Home Decor","shade"],["Pen Stand","Desk","cup"],["Catch Bowl","Desk","bowl"],["Phone Stand","Desk","step"],["Cable Holder","Gadgets","cup"],["Headphone Hook","Gadgets","step"],["Speaker Cover","Gadgets","shade"],["Toy Tower","Toys","step"],["Puzzle Cup","Toys","cup"],["Mini Figure Base","Toys","planter"],["Sculpture","Art","vase"],["Wall Bowl","Art","bowl"]];
var CATS=["All","Home Decor","Desk","Gadgets","Toys","Art"];
var P=[];
for(var i=0;i<1000;i++){
 var nn=NO[Math.floor(i/12)%14],mrp=Math.round((199+r(i,1)*1800)/10)*10-1,d=[10,15,20,25,30,40,50][Math.floor(r(i,2)*7)];
 var sold=Math.floor(20+Math.pow(r(i,3),2)*4000),w=[],ws=0;
 for(var k=0;k<6;k++){w.push(.4+r(i,10+k)+k*.1);ws+=w[k]}
 P.push({id:i,name:AD[i%12]+" "+nn[0]+" Mk"+(Math.floor(i/168)+1),cat:nn[1],shape:nn[2],hue:Math.floor(r(i,4)*360),mrp:mrp,disc:d,
  price:Math.round(mrp*(1-d/100)),rating:(3.7+r(i,5)*1.2).toFixed(1),rev:Math.floor(sold*(.2+r(i,6)*.3)),sold:sold,
  hist:w.map(function(x){return Math.round(sold*x/ws)}),
  offer:d>=40?"Mega deal":d>=25?"Festive offer":r(i,7)>.6?"Bestseller":"New arrival"});
}
/* ===== YOUR PRODUCTS: edit this list =====
   name, cat (category), price and mrp in rupees, img = photo file path.
   Put photos in a folder named "images" next to this file, e.g. img:"images/vase.jpg".
   Leave img:"" to show the layered shape instead. */
var SHOW_SAMPLES=true; /* change to false to hide the 1000 sample models */
var MY_PRODUCTS=[
 {name:"My first product",cat:"Home Decor",price:499,mrp:699,img:"",offer:"New arrival"},
 {name:"My second product",cat:"Desk",price:299,mrp:399,img:"",offer:"Festive offer"}
 /* add more like: {name:"Name",cat:"Gadgets",price:799,mrp:999,img:"images/name.jpg",offer:"Bestseller"}, */
];
var mine=MY_PRODUCTS.map(function(m,i){return{name:m.name,cat:m.cat,shape:"vase",hue:30+i*60,mrp:m.mrp,price:m.price,
 disc:Math.round((1-m.price/m.mrp)*100),rating:m.rating||"4.5",rev:m.rev||0,sold:m.sold||0,hist:m.hist||[0,0,0,0,0,0],
 offer:m.offer||"New arrival",img:m.img||""}});
P=mine.concat(SHOW_SAMPLES?P:[]);
P.forEach(function(p,i){p.id=i});
CATS=["All"];P.forEach(function(p){if(CATS.indexOf(p.cat)<0)CATS.push(p.cat)});
var S={tab:"home",cat:"All",q:"",shown:24,wallet:5000,cart:{},viewed:12480,retained:3215,orders:1846};
var SV=[
 ["PPT and presentations","Pitch decks, investor presentations and company profiles that are clear and on brand."],
 ["Website development","Company websites, landing pages and online stores built to bring in customers."],
 ["Data analytics","Dashboards and reports on sales, customers and retention for startups and teams."],
 ["Gap analysis and problem solving","We review your product and process, find what is missing, and give a plan to fix it."],
 ["3D printing and prototyping","Custom parts, prototypes and product models, printed in days."],
 ["Branding and social media","Logos, brand kits and content design for launches and campaigns."]
];
function inr(n){return "₹"+n.toLocaleString("en-IN")}
function toast(t){var e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display="none"},2200)}
function list(){var q=S.q.toLowerCase();return P.filter(function(p){return(S.cat==="All"||p.cat===S.cat)&&(!q||(p.name+" "+p.cat+" "+p.offer).toLowerCase().indexOf(q)>-1)})}
function pic(p,n){return p.img?'<img src="'+p.img+'" alt="'+p.name+'">':art(p.shape,p.hue,n)}
function card(p){
 var mx=Math.max.apply(null,p.hist)||1;
 return '<article class="p"><div class="th">'+pic(p,24)+'<span class="tag">'+p.offer+'</span></div><div class="pb"><h3>'+p.name+'</h3><span class="mut">'+p.cat+'</span>'+
 '<div class="pr"><b>'+inr(p.price)+'</b><s>'+inr(p.mrp)+'</s><em>'+p.disc+'% off</em></div>'+
 '<div class="rate">★ '+p.rating+' <span class="mut">('+p.rev+' ratings)</span></div>'+
 '<div class="mut">'+p.sold.toLocaleString("en-IN")+' sold · last 6 months</div>'+
 '<div class="hist" aria-hidden="true">'+p.hist.map(function(h){return '<i style="height:'+Math.round(h/mx*100)+'%"></i>'}).join("")+'</div>'+
 '<div class="acts"><button class="b buy" data-a="buy" data-id="'+p.id+'">Buy now</button><button class="b add" data-a="add" data-id="'+p.id+'">Add to cart</button></div></div></article>';
}
function cnt(){var n=0;for(var k in S.cart)n+=S.cart[k];return n}
function render(){
 var h="",m=$("#m");
 document.querySelectorAll("nav.tabs button").forEach(function(b){b.classList.toggle("on",b.dataset.t===S.tab)});
 var c=cnt();$("#cb").style.display=c?"block":"none";$("#cb").textContent=c;
 $("#wb").textContent="Wallet "+inr(S.wallet);
 if(S.tab==="home"){
  var st=function(v,l,c){return '<div class="st" style="--c:'+c+'"><b>'+v+'</b><span>'+l+'</span></div>'};
  h='<section class="hero"><h1>3D printed products and business services</h1><p>Shop 1000 printed models, and get websites, presentations and data analytics for startups to MNCs.</p><div class="hb"><button data-t="cat" style="background:var(--cat);color:#000">Shop products</button><button data-t="svc" style="background:var(--svc);color:#000">See services</button></div></section><h2 class="t"><span class="live"></span>Products</h2><div class="stats">'+
   st(S.viewed.toLocaleString("en-IN"),"Customers viewed","var(--home)")+st(S.retained.toLocaleString("en-IN"),"Customers retained","var(--cat)")+
   st(S.orders.toLocaleString("en-IN"),"Total customer orders","var(--cart)")+st("4.7 ★","Customer ratings","var(--svc)")+'</div>'+
   '<h2 class="t"><span class="live"></span>Services</h2><div class="stats">'+
   st("214","Services we reached","var(--home)")+st("82%","Client retention","var(--cat)")+st("4.8 ★","Client ratings","var(--cart)")+'</div>'+
   '<p class="mut" style="margin-top:20px">Orders update live when a purchase is made here. Other numbers are sample values until your analytics is connected.</p>';
 }else if(S.tab==="cat"){
  var L=list();
  h='<div class="chips">'+CATS.map(function(x){return '<button data-a="cat" data-c="'+x+'" class="'+(x===S.cat?"on":"")+'">'+x+'</button>'}).join("")+'</div>'+
   '<p class="mut">'+L.length+' models'+(S.q?' for “'+S.q+'”':'')+'</p>'+
   (L.length?'<div class="grid">'+L.slice(0,S.shown).map(card).join("")+'</div>':'<div class="empty">No models match your search. Try another word.</div>')+
   (L.length>S.shown?'<button class="more" data-a="more">Show more models</button>':'');
 }else if(S.tab==="cart"){
  var ids=Object.keys(S.cart);
  if(!ids.length)h='<div class="empty">Your cart is empty.<br>Add a model from the Category tab.</div>';
  else{
   var sub=0,mrp=0;
   h=ids.map(function(id){var p=P[id],q=S.cart[id];sub+=p.price*q;mrp+=p.mrp*q;
    return '<div class="row">'+pic(p,18)+'<div class="i"><b>'+p.name+'</b><div class="pr"><b style="font-size:16px">'+inr(p.price)+'</b><s>'+inr(p.mrp)+'</s></div><div class="q"><button data-a="dec" data-id="'+id+'" aria-label="Less">−</button>'+q+'<button data-a="inc" data-id="'+id+'" aria-label="More">+</button></div></div><button class="rm" data-a="rm" data-id="'+id+'">Remove</button></div>'}).join("")+
   '<div class="sum"><div><span>Price ('+c+' items)</span><span>'+inr(mrp)+'</span></div><div><span>Discount</span><span style="color:var(--cart)">− '+inr(mrp-sub)+'</span></div><div class="tot"><span>Total</span><span>'+inr(sub)+'</span></div></div>'+
   '<button class="big" data-a="buyall">Buy now</button>';
  }
 }else{
  h='<h2 class="t">Services for every business</h2><div class="aud"><div>Startups</div><div>Growing businesses</div><div>MNCs</div></div>'+
   SV.map(function(s){return '<div class="sv"><h3>'+s[0]+'</h3><p>'+s[1]+'</p><button data-a="req" data-n="'+s[0]+'">Request this service</button></div>'}).join("");
 }
 m.innerHTML=h;
}
function pay(amt,n,msg){
 if(S.wallet<amt){toast("Not enough wallet balance. Add money first.");$("#wv").textContent=inr(S.wallet);$("#sheet").classList.add("o");return false}
 S.wallet-=amt;S.orders+=n;toast(msg);return true;
}
document.addEventListener("click",function(e){
 var b=e.target.closest("[data-t],[data-a]");if(!b)return;
 if(b.dataset.t){S.tab=b.dataset.t;scrollTo(0,0);return render()}
 var a=b.dataset.a,id=b.dataset.id;
 if(a==="cat"){S.cat=b.dataset.c;S.shown=24}
 else if(a==="more"){S.shown+=24}
 else if(a==="add"){S.cart[id]=(S.cart[id]||0)+1;toast("Added to cart")}
 else if(a==="inc"){S.cart[id]++}
 else if(a==="dec"){if(--S.cart[id]<1)delete S.cart[id]}
 else if(a==="rm"){delete S.cart[id]}
 else if(a==="buy"){pay(P[id].price,1,"Order placed: "+P[id].name)}
 else if(a==="buyall"){var t=0,n=0;for(var k in S.cart){t+=P[k].price*S.cart[k];n+=S.cart[k]}if(pay(t,n,"Order placed for "+n+" items"))S.cart={}}
 else if(a==="req"){toast("Request noted for "+b.dataset.n+". We will contact you.")}
 else if(a==="topup"){S.wallet+=500;$("#wv").textContent=inr(S.wallet)}
 else if(a==="closew"){$("#sheet").classList.remove("o")}
 render();
});
$("#wb").onclick=function(){$("#wv").textContent=inr(S.wallet);$("#sheet").classList.add("o")};
$("#q").addEventListener("input",function(e){S.q=e.target.value.trim();S.tab="cat";S.shown=24;render()});
render();
</script>
</body>
</html>
